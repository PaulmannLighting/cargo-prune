[[audits.libc]]
who = "Codex (AI-assisted)"
criteria = "safe-to-deploy"
delta = "0.2.186 -> 0.2.191"
notes = "Reviewed the published ABI declaration, build configuration and helper changes. The build script reads compiler and Cargo target metadata to emit ABI cfgs. Platform-specific descriptor-set, control-message and signal-union accessors keep their pointer preconditions on unsafe calls. The safe byte-to-C-char slice helper uses equal-sized, byte-aligned types, and opt-in zero defaults initialize C data that can represent zero. Signal equality and hashing use the initialized scalar header fields. No new ambient access was found. Platform declarations were reviewed structurally and the serial polling path was checked on Linux and at compile time on ARMv7."

